server:
  port: 8085
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/content_publishing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false   # don't fail if RabbitMQ is offline
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 1
logging:
  level:
    com.contentpublishing: DEBUG
