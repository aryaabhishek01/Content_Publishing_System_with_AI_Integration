server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Post Service Uploads (public — images/videos)
        - id: post-service-uploads
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/post-media/**
          filters:
            - name: LoggingFilter
            - StripPrefix=0

        # User Service Uploads (public — profile pictures)
        - id: user-service-uploads
          uri: http://localhost:8081
          predicates:
            - Path=/uploads/profile-pictures/**
          filters:
            - name: LoggingFilter
            - StripPrefix=0

        # User Service Routes (public — no JWT)
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: LoggingFilter
            - StripPrefix=0

        # User Service Routes (protected)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Post Service
        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/posts/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Follow Service
        - id: follow-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/follows/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Message Service
        - id: message-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/messages/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Notification Service
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Admin Service
        - id: admin-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/admin/**
          filters:
            - name: JwtAuthFilter
            - name: AdminRoleFilter
            - name: LoggingFilter
            - StripPrefix=0

        # Feedback Service
        - id: feedback-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/feedback/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

        # AI Agent Service
        - id: ai-agent-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/ai/**
          filters:
            - name: JwtAuthFilter
            - name: LoggingFilter
            - StripPrefix=0

jwt:
  secret: "ContentPublishingSystemSecretKey2024VeryLongAndSecureBase64EncodedKey=="
  expiration: 86400000

logging:
  level:
    com.contentpublishing: DEBUG
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
