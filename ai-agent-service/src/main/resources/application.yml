server:
  port: 8088
spring:
  application:
    name: ai-agent-service
  datasource:
    url: jdbc:mysql://localhost:3306/content_publishing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
logging:
  level:
    com.contentpublishing: DEBUG
